# Pinned so the data volume name never depends on the checkout directory name.
# Without this, Compose derives the project name from the folder, and renaming or
# re-cloning the repository silently starts the bot against an empty database.
name: steam-update-bot

services:
  steam-update-bot:
    image: ghcr.io/thesamecat2/steam-update-bot:${IMAGE_TAG:-latest}
    build:
      context: .
    container_name: steam-update-bot
    env_file:
      - .env
    environment:
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__BotDb: Data Source=/data/steam-update-bot.db
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      # Defaults to the named volume. Set BOT_DATA_PATH to an absolute host path
      # (on Unraid, /mnt/user/appdata/steam-update-bot/data) to use a bind mount.
      - ${BOT_DATA_PATH:-steam-update-bot-data}:/data
    restart: unless-stopped
    stop_grace_period: 1m
    mem_limit: 512m
    cpus: "1.0"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  steam-update-bot-data:
