name: CI

on:
  push:
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet restore SteamUpdateBot.sln
      - run: dotnet build SteamUpdateBot.sln --no-restore --configuration Release
      - run: dotnet test SteamUpdateBot.sln --no-build --configuration Release --collect:"XPlat Code Coverage"
      - run: dotnet format SteamUpdateBot.sln --verify-no-changes --no-restore
      - run: docker build --tag steam-update-bot:ci .
